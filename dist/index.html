<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14243e">
  <meta name="description" content="A visual study book on iambic pentameter, poetic techniques, Shakespeare's language and literary devices.">
  <title>Shakespeare Study Book</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314243e'/%3E%3Cpath d='M11 17c9-3 16-1 21 3 5-4 12-6 21-3v31c-9-3-16-1-21 3-5-4-12-6-21-3zM32 20v31' fill='none' stroke='%23efc47f' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="stage">
    <header class="site-header">
      <a class="wordmark" href="#page-1" aria-label="Shakespeare Study Book, first page"><span class="wordmark-icon" aria-hidden="true">✦</span><span>SHAKESPEARE <small>STUDY BOOK</small></span></a>
      <span class="header-note">A visual guide for close reading</span>
      <span class="header-count">4 chapters <span aria-hidden="true">·</span> 13 pages</span>
    </header>

    <main class="book" aria-label="Shakespeare digital book">
      <section class="contents-page" aria-label="Book contents">
        <div class="contents-inner">
          <div class="eyebrow">THE CONTENTS</div>
          <h1>Read Shakespeare<br><em>with fresh eyes.</em></h1>
          <p class="contents-intro">Choose a chapter, then turn the pages. Select any illustration to view it in full.</p>
          <nav id="chapterNav" class="chapter-nav" aria-label="Chapters"></nav>
          <div class="chapter-detail">
            <div class="detail-heading"><span id="chapterNumber">01</span><span>IN THIS CHAPTER</span></div>
            <h2 id="chapterTitle"></h2>
            <p id="chapterSummary"></p>
            <div id="pageList" class="page-list" aria-label="Pages in this chapter"></div>
          </div>
        </div>
      </section>

      <section class="illustration-page" aria-label="Current book page">
        <div class="plate-topline"><span id="plateChapter"></span><span id="plateIndex"></span></div>
        <div class="plate-heading"><div><div class="eyebrow" id="plateType">ILLUSTRATED STUDY PAGE</div><h2 id="plateTitle"></h2></div><button class="expand-button" id="expandButton" type="button" aria-label="Enlarge current illustration" title="Enlarge image"><span aria-hidden="true">⤢</span><span>Enlarge</span></button></div>
        <button id="imageButton" class="image-frame" type="button" aria-label="Enlarge current illustration"><img id="plateImage" alt="" fetchpriority="high"></button>
        <div class="page-footer"><span id="plateCaption"></span><span class="page-corner" id="pageCorner"></span></div>
      </section>
    </main>

    <footer class="reader-controls" aria-label="Page navigation">
      <button id="prevButton" class="control-button" type="button"><span aria-hidden="true">←</span> Previous</button>
      <div class="reader-progress"><span id="readerStatus" aria-live="polite"></span><div class="progress-track" aria-hidden="true"><div id="progressFill"></div></div></div>
      <button id="nextButton" class="control-button" type="button">Next <span aria-hidden="true">→</span></button>
    </footer>
  </div>

  <dialog id="imageDialog" class="image-dialog" aria-label="Enlarged illustration"><div class="dialog-toolbar"><span id="dialogTitle"></span><button id="closeDialog" type="button" aria-label="Close enlarged illustration">✕ <span>Close</span></button></div><img id="dialogImage" alt=""></dialog>
</body>
</html>
